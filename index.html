<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Champions Fan Edition</title><style>:root{font-family:system-ui;color:#eff5ff;background:#0c1528}*{box-sizing:border-box}body{margin:0}#app{max-width:920px;margin:auto;padding:18px}h1{color:#ffdf7b}nav{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;background:#315da3;color:white;border:1px solid #829bcb;border-radius:9px;padding:12px}button:disabled{opacity:.4}.card{background:#182a44;border:1px solid #3d5c88;border-radius:13px;margin:15px 0;padding:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.item{background:#253855;border-radius:10px;padding:10px;text-align:center}img{image-rendering:pixelated;width:95px;height:95px;object-fit:contain}.arena{background:linear-gradient(#709fc8 0 55%,#72a475 55%);border:4px solid #5274a2;border-radius:12px;padding:12px;display:flex;justify-content:space-around;align-items:center;min-height:235px;color:#091426}.arena>div{max-width:48%;text-align:center}.arena img{width:120px;height:120px}.world{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:1px;max-width:620px}.tile{aspect-ratio:1;border-radius:0;min-width:0;padding:0;background:#519969;font-size:clamp(8px,2vw,18px)}.tile.wall{background:#315d4a}.tile.gate{background:#a79d5f}.tile.player{background:#ead67d}.log{height:110px;overflow:auto;background:#0d1729;padding:12px;border-radius:9px}.hp{height:9px;background:#323d47;border-radius:10px;overflow:hidden}.hp b{display:block;height:100%;background:#62e4a1}.row{display:flex;flex-wrap:wrap;gap:8px}small{color:#a9c4ef}footer{font-size:12px;color:#92a4be;margin:36px 0}@media(max-width:500px){.arena img{width:85px;height:85px}.tile{font-size:10px}}</style><div id="app"><header><small>UNOFFICIAL NONCOMMERCIAL FAN GAME · WEB PREVIEW</small><h1>PIXEL CHAMPIONS</h1><p>배틀에서 시작되는 새로운 이야기</p></header><nav><button onclick="tab='home';render()">로비</button><button onclick="tab='team';render()">팀 편성</button><button onclick="tab='world';render()">도트 탐험</button><button onclick="tab='story';render()">스토리</button><button onclick="tab='battle';render()">배틀</button></nav><main id="view"></main><p style="margin:18px 0"><a href="online.html" style="color:#d9ff8d;font-weight:700">Showdown 기반 PvP 실험실 (별도 서버 필요)</a></p><footer>비공식 팬 제작물 · 공식 포켓몬 게임이 아닙니다 · PokéAPI/Sprites 사용 · Showdown 공식 엔진 미연동</footer></div><script>const ids=[6,9,25,94,130,149,445,448,282,658,376,248,637,700,778,887,908,911];const names={6:'리자몽',9:'거북왕',25:'피카츄',94:'팬텀',130:'갸라도스',149:'망나뇽',445:'한카리아스',448:'루카리오',282:'가디안',658:'개굴닌자',376:'메타그로스',248:'마기라스',637:'불카모스',700:'님피아',778:'따라큐',887:'드래펄트',908:'마스카나',911:'라우드본'};const types={6:'fire',9:'water',25:'electric',94:'ghost',130:'water',149:'dragon',445:'ground',448:'fighting',282:'fairy',658:'water',376:'steel',248:'rock',637:'fire',700:'fairy',778:'ghost',887:'dragon',908:'grass',911:'fire'};const counters={fire:['grass','steel'],water:['fire','ground','rock'],grass:['water','ground'],electric:['water'],ground:['fire','electric'],fairy:['dragon','fighting'],dragon:['dragon'],fighting:['rock','steel'],ghost:['ghost'],rock:['fire'],steel:['fairy']};const chapters=[['제1장 첫 번째 라이벌',[25,94]],['제2장 안개 도시',[130,448,282]],['제3장 고대 유적',[445,248,637]],['제4장 그림자 리그',[778,658,887]],['최종장 챔피언의 증명',[149,376,6]]];let data={team:[6,25,445],wins:0,cleared:0,position:108,potions:5};try{data={...data,...JSON.parse(localStorage.getItem('pixelChampionsWebSave')||'{}')}}catch{};let tab='home',battle=null;const $=x=>document.querySelector(x);const save=()=>localStorage.setItem('pixelChampionsWebSave',JSON.stringify(data));const img=(id,back=false)=>'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+(back?'back/':'')+id+'.png';const poke=id=>'<img src="'+img(id)+'" alt="'+names[id]+'"><b>'+names[id]+'</b><p><small>'+types[id]+'</small></p>';function render(){let v=$('#view');if(tab==='home')v.innerHTML='<section class=card><h2>환영합니다, 트레이너!</h2><p>18종 포켓몬으로 3마리 팀을 편성하고 5장 스토리와 픽셀 지도를 탐험하세요.</p><p>승리 '+data.wins+'회 · 스토리 '+data.cleared+'/5 · 상처약 '+data.potions+'개</p><button onclick="tab=\'world\';render()">모험 시작</button></section>';if(tab==='team')v.innerHTML='<h2>3마리 팀 편성 ('+data.team.length+'/3)</h2><div class=grid>'+ids.map(id=>'<div class=item>'+poke(id)+'<button onclick="pick('+id+')">'+(data.team.includes(id)?'제외':'추가')+'</button></div>').join('')+'</div>';if(tab==='story')v.innerHTML='<h2>스토리 · 챔피언 로드</h2>'+chapters.map((ch,i)=>'<section class=card><h3>'+ch[0]+'</h3><p>'+ch[1].map(x=>names[x]).join(' · ')+'</p><button '+(i>data.cleared?'disabled':'')+' onclick="start('+i+')">'+(i<data.cleared?'재도전':'대결 시작')+'</button></section>').join('');if(tab==='world')v.innerHTML='<h2>별빛 시티 · 탐험 지도</h2><p>인접 타일을 눌러 이동하세요. 경기장 🏟️에 도착하면 스토리 배틀을 시작합니다.</p><div class=world>'+Array.from({length:168},(_,i)=>'<button class="tile '+(i===data.position?'player':i%23===0?'wall':[23,71,119,165].includes(i)?'gate':'')+'" onclick="walk('+i+')">'+(i===data.position?'🧢':[23,71,119,165].includes(i)?'🏟️':i%11===0?'🌳':'')+'</button>').join('')+'</div><p>좌표 '+(data.position%14+1)+','+(Math.floor(data.position/14)+1)+'</p>';if(tab==='battle')v.innerHTML=battle?battleHTML():'<section class=card><h2>연습 배틀</h2><button onclick="start(-1)">AI와 대결</button></section>'}function pick(id){if(data.team.includes(id)){if(data.team.length===1)return;data.team=data.team.filter(n=>n!==id)}else if(data.team.length<3)data.team.push(id);else return alert('최대 3마리');save();render()}function walk(i){const a=data.position;if((Math.abs(a-i)===14||Math.abs(a-i)===1&&Math.floor(a/14)===Math.floor(i/14))&&i%23!==0){data.position=i;save();render();if([23,71,119,165].includes(i)&&confirm('경기장 도착! 스토리 배틀 시작할까요?'))start(Math.min(data.cleared,4))}}function mk(id){return{id,hp:130,max:130,pp:10,status:null}}function start(n){battle={stage:n,team:data.team.map(mk),enemy:(n<0?[94,130,448]:chapters[n][1]).map(mk),me:0,ai:0,log:['배틀 시작!'],over:false,tera:false};tab='battle';render()}function current(side){return battle[side][battle[side==='team'?'me':'ai']]}function hit(a,b,power){let adv=counters[types[a.id]]?.includes(types[b.id])?2:1;let loss=Math.floor((power/4+Math.random()*13)*(adv)*(a.tera?1.4:1));b.hp=Math.max(0,b.hp-loss);battle.log.push(names[a.id]+' 공격! '+loss+' 피해'+(adv>1?' 효과가 굉장했다!':''));if(b.hp===0)battle.log.push(names[b.id]+' 쓰러졌다!')}function state(){if(battle.enemy.every(x=>x.hp<=0)){battle.over=true;data.wins++;if(battle.stage===data.cleared)data.cleared++;if(data.wins%3===0)data.potions++;save();battle.log.push('승리!');return}if(battle.team.every(x=>x.hp<=0)){battle.over=true;battle.log.push('패배!');return}if(current('enemy').hp===0)battle.ai=battle.enemy.findIndex(x=>x.hp>0);if(current('team').hp===0)battle.me=battle.team.findIndex(x=>x.hp>0)}function enemyMove(){state();if(battle.over)return;hit(current('enemy'),current('team'),65);state()}function move(power){if(battle.over)return;let a=current('team');if(a.pp<=0)return alert('PP 부족');a.pp--;hit(a,current('enemy'),power);state();if(!battle.over)enemyMove();render()}function change(i){if(i===battle.me||battle.team[i].hp<=0)return;battle.me=i;battle.log.push(names[current('team').id]+' 교체!');enemyMove();render()}function potion(){if(data.potions<=0||battle.over)return;let a=current('team');if(a.hp===a.max)return;data.potions--;a.hp=Math.min(a.max,a.hp+40);save();enemyMove();render()}function tera(){if(battle.tera)return;battle.tera=true;current('team').tera=true;battle.log.push('테라스탈! (간이 배틀 강화)');render()}function health(x){return '<div class=hp><b style="width:'+x.hp/x.max*100+'%"></b></div><small>'+x.hp+'/'+x.max+' HP</small>'}function battleHTML(){let a=current('team'),e=current('enemy');return '<div class=card><h2>'+(battle.stage<0?'연습 배틀':chapters[battle.stage][0])+'</h2><div class=arena><div>'+names[a.id]+'<br><img src="'+img(a.id,true)+'">'+health(a)+'</div><div>'+names[e.id]+'<br><img src="'+img(e.id)+'">'+health(e)+'</div></div><div class=log>'+battle.log.slice(-7).join('<br>')+'</div>'+(battle.over?'<h2>배틀 종료</h2><button onclick="battle=null;tab=\'story\';render()">돌아가기</button>':'<p>남은 PP '+a.pp+'</p><div class=row><button onclick="move(55)">기본 공격</button><button onclick="move(80)">강력한 공격</button><button onclick="tera()" '+(battle.tera?'disabled':'')+'>테라스탈</button><button onclick="potion()">상처약 '+data.potions+'</button></div><h3>교체</h3><div class=row>'+battle.team.map((x,i)=>'<button '+(x.hp===0||i===battle.me?'disabled':'')+' onclick="change('+i+')">'+names[x.id]+' '+x.hp+'HP</button>').join('')+'</div>')+'</div>'}render();</script></html>

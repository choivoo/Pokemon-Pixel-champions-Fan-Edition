<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Champions PvP — 개발용 연결</title><style>body{font:16px system-ui;max-width:750px;margin:35px auto;padding:15px;background:#101a30;color:#e8f5ff}button,input,select{padding:12px;margin:5px;border-radius:8px}button{background:#507fc6;color:white;border:0}input{max-width:100%}#events{height:270px;overflow:auto;white-space:pre-wrap;background:#25395c;padding:12px;border-radius:9px}</style><h1>PIXEL CHAMPIONS · Showdown PvP 실험실</h1><p>Showdown 시뮬레이터 기반 PvP 프로토콜 클라이언트. 공개 PvP 서비스가 아니며, 별도 배포한 WebSocket 서버 주소가 필요합니다.</p><p><input id="url" size="34" placeholder="wss://배포된-서버-주소"><input id="nick" placeholder="트레이너 이름"></p><select id="fmt"><option value="gen7randombattle">7세대 랜덤 배틀 (메가·Z)</option><option value="gen9randombattle">9세대 랜덤 배틀 (테라스탈)</option></select><button id="connect">서버 연결 및 매칭</button><p id="status">연결 대기</p><div id="events" aria-live="polite"></div><h3>기술 선택</h3><div id="choices"></div><p><button id="forfeit">항복</button><a href="index.html" style="color:#aaccff">스토리 게임으로</a></p><script>let ws,side;const log=x=>{const out=document.querySelector('#events');out.textContent+=x+'\n';out.scrollTop=out.scrollHeight};const choice=x=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:'choose',choice:x}))};document.querySelector('#connect').onclick=()=>{const url=document.querySelector('#url').value.trim();if(!/^wss:\/\//.test(url))return alert('HTTPS 페이지에서는 wss:// 서버 주소가 필요합니다');ws=new WebSocket(url);ws.onopen=()=>{document.querySelector('#status').textContent='매칭 대기';ws.send(JSON.stringify({type:'queue',format:document.querySelector('#fmt').value,nick:document.querySelector('#nick').value}))};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='match'){side=d.side;document.querySelector('#status').textContent='배틀 중 · '+side}if(d.type==='protocol'){log(d.text);const matches=[...d.text.matchAll(/\|request\|(\{[^\n]+\})/g)];for(const m of matches){try{const req=JSON.parse(m[1]);const area=document.querySelector('#choices');area.replaceChildren();if(req.active?.[0]?.moves){req.active[0].moves.forEach((mv,i)=>{const btn=document.createElement('button');btn.textContent=(i+1)+'. '+mv.move+' (PP '+mv.pp+')';btn.onclick=()=>choice('move '+(i+1));area.append(btn)})}if(req.side?.pokemon)req.side.pokemon.forEach((p,i)=>{const b=document.createElement('button');b.textContent='교체 '+(i+1)+' '+p.ident;b.onclick=()=>choice('switch '+(i+1));area.append(b)});for(const [label,suffix] of [['메가진화','mega'],['Z기술','zmove'],['테라스탈','terastallize']]){if((suffix==='mega'&&req.active?.[0]?.canMegaEvo)||(suffix==='zmove'&&req.active?.[0]?.canZMove)||(suffix==='terastallize'&&req.active?.[0]?.canTerastallize)){const b=document.createElement('button');b.textContent=label+' (1번 기술)';b.onclick=()=>choice('move 1 '+suffix);area.append(b)}}}catch{}}}else log(JSON.stringify(d))};ws.onerror=()=>log('서버 연결 오류');ws.onclose=()=>document.querySelector('#status').textContent='연결 종료'};document.querySelector('#forfeit').onclick=()=>ws?.send(JSON.stringify({type:'forfeit'}));</script></html>
